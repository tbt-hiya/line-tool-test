<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>w-next 受付</title>
<style>
  :root { --green:#06C755; --ink:#1c1f23; --sub:#5f6670; --line:#e3e6ea; --bg:#f6f7f9; --err:#c62828; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; color:var(--ink); background:var(--bg); line-height:1.6; }
  main { max-width:520px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:20px; margin:0 0 8px; }
  h2 { font-size:16px; margin:28px 0 0; padding:8px 12px; background:#eef8f1; border-left:4px solid var(--green); border-radius:4px; }
  p.lead { color:var(--sub); margin:0 0 20px; font-size:14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px 16px; }
  .field { margin-top:20px; }
  .field > label, .field > .label { display:block; font-size:14px; font-weight:600; margin:0 0 6px; }
  .req, .opt { white-space:nowrap; display:inline-block; }
  .req { color:#fff; background:var(--err); font-size:11px; padding:1px 6px; border-radius:4px; margin-left:6px; vertical-align:1px; }
  .opt { color:var(--sub); background:#eceef1; font-size:11px; padding:1px 6px; border-radius:4px; margin-left:6px; vertical-align:1px; }
  .help { font-size:12px; color:var(--sub); margin:-2px 0 6px; white-space:pre-line; }
  input[type=text], input[type=tel], input[type=email], input:not([type]), textarea { width:100%; font-size:16px; padding:11px 12px; border:1px solid #cfd4da; border-radius:8px; background:#fff; color:var(--ink); }
  textarea { min-height:84px; resize:vertical; }
  .choices { display:flex; flex-wrap:wrap; gap:8px; }
  .choices label { display:flex; align-items:center; gap:6px; font-size:15px; font-weight:400; padding:9px 12px; border:1px solid #cfd4da; border-radius:8px; background:#fff; margin:0; }
  .choices input { width:18px; height:18px; margin:0; accent-color:var(--green); }
  .choices label:has(input:checked) { border-color:var(--green); background:#eef8f1; }
  .file { display:flex; align-items:center; gap:12px; padding:10px; border:1px dashed #b8bfc7; border-radius:8px; background:#fafbfc; }
  .file img { width:64px; height:64px; object-fit:cover; border-radius:6px; background:#e9ecef; flex:none; }
  .file .ph { width:64px; height:64px; border-radius:6px; background:#e9ecef; flex:none; display:flex; align-items:center; justify-content:center; color:#9aa1a9; font-size:12px; }
  .file .pick { flex:1; font-size:14px; }
  .file .pick button { width:auto; margin:0; padding:8px 14px; font-size:14px; font-weight:600; color:var(--ink); background:#fff; border:1px solid #cfd4da; border-radius:8px; }
  .file .name { display:block; font-size:12px; color:var(--sub); margin-top:4px; word-break:break-all; }
  .file input { display:none; }
  .err { color:var(--err); font-size:13px; margin-top:4px; }
  .err:empty { display:none; }
  .has-err input[type=text], .has-err input[type=tel], .has-err input[type=email], .has-err input:not([type]), .has-err textarea, .has-err .file { border-color:var(--err); }
  button.main { width:100%; margin-top:28px; padding:15px; font-size:17px; font-weight:700; color:#fff; background:var(--green); border:0; border-radius:10px; }
  button:disabled { opacity:.5; }
  .center { text-align:center; padding:48px 8px; }
  .spinner { width:32px; height:32px; border:3px solid var(--line); border-top-color:var(--green); border-radius:50%; margin:0 auto 16px; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .hidden { display:none; }
  .note { font-size:12px; color:var(--sub); margin-top:16px; }
  .okmark { display:none; color:var(--green); font-weight:700; font-size:13px; margin-left:8px; white-space:nowrap; }
  .field.ok .okmark { display:inline-block; }
  .field.ok input[type=text], .field.ok input[type=tel], .field.ok input[type=email], .field.ok .file { border-color:var(--green); }
  .zipmsg { font-size:12px; color:var(--sub); margin-top:4px; }
  .zipmsg:empty { display:none; }
  #reqCount { position:sticky; top:0; z-index:5; margin:0 -16px 8px; padding:8px 16px; font-size:13px; font-weight:600; color:var(--sub); background:rgba(246,247,249,.95); border-bottom:1px solid var(--line); }
  #reqCount.all { color:var(--green); }
  .progress { font-size:14px; color:var(--sub); text-align:center; margin-top:10px; }
</style>
</head>
<body>
<main>
  <section id="loading" class="center"><div class="spinner"></div><p>読み込み中です…</p></section>

  <section id="done" class="center hidden">
    <h1 id="doneTitle">ありがとうございます</h1>
    <p class="lead" id="doneText"></p>
    <button id="toChat" class="main" type="button">LINEのトークに戻る</button>
  </section>

  <section id="formView" class="hidden">
    <h1>ローン仮審査ヒアリングフォーム（テスト）</h1>
    <p class="lead">ローン審査を進めるにあたり、必要情報のご入力をお願いいたします。項目が少し多くお手数をおかけしますが、事前に詳細確認をさせていただくことで<br>・月々のお支払い調整<br>・ご契約までの流れ<br>をスムーズに進められます。<br>入力途中の内容は、この端末に一時保存されます。</p>
    <div id="reqCount"></div>
    <form id="form" class="card" novalidate></form>
  </section>
</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const CONF = {
  LIFF_ID: '2011873300-jeZJn9IC',
  GAS_URL: 'https://script.google.com/macros/s/AKfycbyxq3Rq5EFNHd2C6DO-1bXpyWzDLbqItbAP3AXHfixcY9xwThQkGqBnqoA_GGZVIow/exec',
  BOT_ID: '@145kftyf',
  DRAFT_KEY: 'wnext_form_draft_v2',
};

/* ---------- フォームの項目（ここを直せば項目を変えられます） ----------
   k: 保存するときの名前（スプレッドシートの列名）  t: 画面に出す名前
   type: text / tel / email / num / date8 / radio / check / textarea / file / h（見出し）
   req: 必須  help: 説明文  opts: 選択肢  min/max: 数字の範囲  ph: 入力例 */
const FIELDS = [
  { k:'氏名', t:'氏名（漢字）', type:'text', req:true, ph:'例）山田 太郎', ac:'name' },
  { k:'ふりがな', t:'氏名（ふりがな）', type:'text', req:true, ph:'例）やまだ たろう' },
  { k:'生年月日', t:'生年月日', type:'date8', req:true, help:'8桁の数字で入力してください（例：1990年4月5日 → 19900405）' },
  { k:'郵便番号', t:'郵便番号', type:'zip', req:true, ph:'例）9000001', help:'7桁を入れると、ご住所が自動で入ります' },
  { k:'住所', t:'ご住所（免許証通り・建物名号室まで）', type:'text', req:true, ac:'street-address' },
  { k:'電話番号', t:'電話番号', type:'tel', req:true, ph:'例）09012345678', ac:'tel' },
  { k:'メールアドレス', t:'メールアドレス', type:'email', req:true, ac:'email' },
  { k:'居住形態', t:'居住形態', type:'radio', req:true, opts:['自己所有','家族所有','社宅','借家','賃貸マンション','公営・公団','アパート','寮'] },
  { k:'居住年数', t:'居住年数（〇年〇ヶ月の形でご入力ください）', type:'text', req:true, ph:'例）3年6ヶ月' },
  { k:'住宅ローン・家賃支払い', t:'住宅ローン・家賃支払い', type:'radio', req:true, opts:['有','無'] },
  { k:'配偶者', t:'配偶者', type:'radio', req:true, opts:['有（有職）','有（無職）','無'] },
  { k:'お子様の人数', t:'お子様の人数（人）', type:'num', req:true, min:0, max:20 },
  { k:'世帯人数', t:'世帯人数（ご本人様含む・人数）', type:'num', req:true, min:1, max:20 },
  { k:'世帯主のお名前', t:'主たる生計維持者（世帯主）のお名前', type:'text', req:true },
  { k:'世帯主の続柄', t:'世帯主の続柄', type:'text', req:true, help:'例）本人・父・母' },
  { k:'世帯主との同居', t:'世帯主との同居', type:'radio', req:true, opts:['有','無'] },
  { k:'他社お借入れ総額（万円）', t:'他社お借入れ総額（住宅ローン除く・万円）', type:'num', req:true, min:0, max:9999, help:'0円の場合は0とご入力ください' },
  { k:'他社借入の件数', t:'他社借入の件数（住宅ローン除く）', type:'num', req:true, min:0, max:100, help:'0件の場合は0とご入力ください' },
  { k:'連帯保証人予定者の有無', t:'連帯保証人予定者の有無', type:'radio', req:true, opts:['有','無'] },

  { type:'h', t:'お仕事について' },
  { k:'職業', t:'ご職業', type:'radio', req:true, opts:['自営業','正社員','契約社員','派遣社員','パート・アルバイト','会社役員'] },
  { k:'お勤め先名', t:'お勤め先名（正式名称）', type:'text', req:true },
  { k:'お勤め先住所', t:'お勤め先住所', type:'text', req:true },
  { k:'お勤め先電話番号', t:'お勤め先電話番号（代表電話）', type:'tel', req:true },
  { k:'従業員数', t:'従業員数', type:'num', req:false, min:0, max:999999 },
  { k:'勤続年数', t:'勤続年数（〇年〇ヶ月の形でご入力ください）', type:'text', req:true, ph:'例）2年3ヶ月' },
  { k:'税込年収（万円）', t:'税込年収（支払い総額・万円）', type:'num', req:true, min:0, max:9999 },
  { k:'手取り月収（万円）', t:'手取り月収（万円）', type:'num', req:true, min:0, max:9999 },
  { k:'月の支出額（万円）', t:'月の支出額（万円）', type:'num', req:true, min:0, max:9999 },
  { k:'預金残高（万円）', t:'預金残高（万円）', type:'num', req:true, min:0, max:9999 },

  { type:'h', t:'ご希望条件' },
  { k:'頭金予定額（万円）', t:'頭金予定額（万円）', type:'num', req:true, min:0, max:999, help:'0円の場合は0とご入力ください' },
  { k:'月々ご希望予算（万円）', t:'月々ご希望予算（万円）', type:'num', req:true, min:0, max:10 },
  { k:'ご希望返済回数', t:'ご希望返済回数', type:'radio', req:false, opts:['12回（1年）','24回（2年）','36回（3年）','48回（4年）','60回（5年）','おまかせ'] },
  { k:'お車保有台数', t:'現在のお車保有台数（台）', type:'num', req:true, min:0, max:10 },

  { type:'h', t:'審査必要書類4点セット' },
  { k:'免許証（表面）', t:'免許証（表面）', type:'file', req:true, help:'※スマホのカメラで撮った写真で大丈夫です。' },
  { k:'免許証（裏面）', t:'免許証（裏面）', type:'file', req:true, help:'※スマホのカメラで撮った写真で大丈夫です。' },
  { k:'健康保険証（表面）', t:'健康保険証（表面）', type:'file', req:true, help:'※スマホのカメラで撮った写真で大丈夫です。' },
  { k:'健康保険証（裏面）', t:'健康保険証（裏面）', type:'file', req:true, help:'※スマホのカメラで撮った写真で大丈夫です。' },
  { k:'確定申告書類', t:'確定申告書類', type:'file', req:false, help:'※ある場合はでOKです。\n※スマホのカメラで撮った写真で大丈夫です。' },
  { k:'給与明細①', t:'直近3ヶ月分の収入がわかる給与明細①', type:'file', req:false, help:'※ある場合はでOKです。' },
  { k:'給与明細②', t:'直近3ヶ月分の収入がわかる給与明細②', type:'file', req:false, help:'※ある場合はでOKです。' },
  { k:'給与明細③', t:'直近3ヶ月分の収入がわかる給与明細③', type:'file', req:false, help:'※ある場合はでOKです。' },

  { type:'h', t:'その他' },
  { k:'つながりやすい時間帯', t:'お電話のつながりやすいお時間帯', type:'text', req:false, ph:'例）平日18時以降' },
  { k:'ご要望', t:'ご質問・備考', type:'textarea', req:false },
  { k:'審査同意', t:'審査を同意する', type:'check', req:true, opts:['信販会社への審査を同意する'],
    help:'総支払い金額が10万円以上変わることもあるので、自社ローンと並行して審査をしていただいております。' },
];

const $ = id => document.getElementById(id);
const show = id => { ['loading','done','formView'].forEach(x => $(x).classList.toggle('hidden', x !== id)); };
const ADD_URL = 'https://line.me/R/ti/p/' + encodeURIComponent(CONF.BOT_ID);
const CHAT_URL = 'https://line.me/R/oaMessage/' + encodeURIComponent(CONF.BOT_ID) + '/';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
const toHalf = s => String(s || '').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[ー－‐―]/g, '-');

function params() {
  const p = {}; new URLSearchParams(location.search).forEach((v, k) => { p[k] = v; }); return p;
}

async function post(data, timeoutMs) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeoutMs || 15000);
  try {
    const res = await fetch(CONF.GAS_URL, { method: 'POST', body: JSON.stringify(Object.assign({ type: 'liff' }, data)), signal: ctrl.signal });
    return await res.json();
  } finally { clearTimeout(t); }
}

function done(title, text) {
  $('doneTitle').textContent = title; $('doneText').textContent = text; show('done');
}

$('toChat').addEventListener('click', () => {
  if (liff.isInClient()) liff.closeWindow(); else location.href = CHAT_URL;
});

async function main() {
  await liff.init({ liffId: CONF.LIFF_ID });
  if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
  const p = params();
  const idToken = liff.getIDToken();
  let isFriend = false;
  try { isFriend = (await liff.getFriendship()).friendFlag; } catch (e) {}

  if (p.p === 'form') { setupForm(); show('formView'); return; }

  // 受付：経路を記録してから、友だち追加の画面へ
  try { await post({ action: 'entry', idToken, params: p, isFriend }, 8000); } catch (e) {}
  if (isFriend) {
    done('友だち追加済みです', 'このままトークでご相談いただけます。');
    if (!liff.isInClient()) location.href = CHAT_URL;
  } else {
    location.href = ADD_URL;
  }
}

/* ---------- フォーム ---------- */
const picked = {};   // 項目名 -> 選ばれた写真（File）

function fieldHtml(f, i) {
  if (f.type === 'h') return '<h2>' + esc(f.t) + '</h2>';
  const badge = (f.req ? '<span class="req">必須</span>' : '<span class="opt">任意</span>') + (f.req ? '<span class="okmark">✓ OK</span>' : '');
  const help = f.help ? '<div class="help">' + esc(f.help) + '</div>' : '';
  const id = 'f' + i, name = esc(f.k);
  let body = '';
  if (f.type === 'radio' || f.type === 'check') {
    const type = f.type === 'radio' ? 'radio' : 'checkbox';
    body = '<div class="choices">' + f.opts.map(o => '<label><input type="' + type + '" name="' + name + '" value="' + esc(o) + '">' + esc(o) + '</label>').join('') + '</div>';
    return '<div class="field" data-k="' + name + '"><div class="label">' + esc(f.t) + badge + '</div>' + help + body + '<div class="err"></div></div>';
  }
  if (f.type === 'file') {
    body = '<div class="file"><div class="ph">写真</div><div class="pick"><button type="button">写真を選ぶ</button><span class="name">まだ選ばれていません</span></div>' +
           '<input type="file" accept="image/*" name="' + name + '"></div>';
    return '<div class="field" data-k="' + name + '"><div class="label">' + esc(f.t) + badge + '</div>' + help + body + '<div class="err"></div></div>';
  }
  if (f.type === 'textarea') body = '<textarea id="' + id + '" name="' + name + '"></textarea>';
  else {
    const attrs = {
      text: 'type="text"', email: 'type="email" inputmode="email" autocapitalize="off"', tel: 'type="tel" inputmode="tel"',
      num: 'type="text" inputmode="numeric"', zip: 'type="text" inputmode="numeric" maxlength="8" autocomplete="postal-code"',
      date8: 'type="text" inputmode="numeric" maxlength="8" placeholder="例）19900405"',
    }[f.type] || 'type="text"';
    body = '<input id="' + id + '" name="' + name + '" ' + attrs + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : '') + (f.ac ? ' autocomplete="' + f.ac + '"' : '') + '>';
  }
  const extra = f.type === 'zip' ? '<div class="zipmsg"></div>' : '';
  return '<div class="field" data-k="' + name + '"><label for="' + id + '">' + esc(f.t) + badge + '</label>' + help + body + extra + '<div class="err"></div></div>';
}

function setupForm() {
  const form = $('form');
  form.innerHTML = FIELDS.map(fieldHtml).join('') +
    '<button id="submit" class="main" type="submit">送信する</button><div class="progress" id="progress"></div><div class="err" id="submitErr"></div>' +
    '<p class="note">これはテスト用のフォームです。</p>';

  // 写真の選択
  form.querySelectorAll('.file').forEach(box => {
    const input = box.querySelector('input');
    box.querySelector('button').addEventListener('click', () => input.click());
    input.addEventListener('change', () => {
      const file = input.files && input.files[0];
      if (!file) return;
      picked[input.name] = file;
      box.querySelector('.name').textContent = file.name || '写真を選びました';
      const url = URL.createObjectURL(file);
      const old = box.querySelector('.ph, img');
      const img = document.createElement('img'); img.src = url; img.alt = '';
      img.onerror = () => { img.replaceWith(Object.assign(document.createElement('div'), { className: 'ph', textContent: '選択済' })); };
      old.replaceWith(img);
      refreshField(form, byKey[input.name], true);
    });
  });

  const byKey = {}; FIELDS.forEach(f => { if (f.k) byKey[f.k] = f; });
  restoreDraft(form);
  FIELDS.forEach(f => { if (f.k) refreshField(form, f, false); });
  form.addEventListener('input', e => {
    const f = byKey[e.target.name]; if (!f) return;
    refreshField(form, f, f.type === 'radio' || f.type === 'check');
    if (f.k === '郵便番号') lookupZip(form);
    if (f.k === '住所' && e.target.value.trim() !== zipFilled) zipFilled = '';
    saveDraft(form);
  });
  form.addEventListener('change', e => { const f = byKey[e.target.name]; if (f && f.type !== 'file') refreshField(form, f, true); saveDraft(form); });
  form.addEventListener('focusout', e => { const f = byKey[e.target.name]; if (f && f.type !== 'file') refreshField(form, f, true); });
  form.addEventListener('submit', e => { e.preventDefault(); submit(form); });
}

function setErr(k, msg) {
  const box = document.querySelector('.field[data-k="' + CSS.escape(k) + '"]');
  if (!box) return;
  box.querySelector('.err').textContent = msg;
  box.classList.toggle('has-err', !!msg);
}

function collect(form) {
  const a = {};
  FIELDS.forEach(f => {
    if (!f.k || f.type === 'file') return;
    if (f.type === 'radio') { const c = form.querySelector('input[name="' + CSS.escape(f.k) + '"]:checked'); a[f.k] = c ? c.value : ''; return; }
    if (f.type === 'check') { a[f.k] = [...form.querySelectorAll('input[name="' + CSS.escape(f.k) + '"]:checked')].map(c => c.value).join('、'); return; }
    a[f.k] = String(form.elements[f.k].value || '').trim();
  });
  return a;
}

// 1つの項目を確かめる。{ err: エラー文（なければ ''）, val: 整えた値, empty: 未入力か }
function checkOne(f, v) {
  if (f.type === 'file') v = picked[f.k];
  if (!v) {
    const err = !f.req ? '' : f.type === 'file' ? '写真を選んでください' : (f.type === 'radio' || f.type === 'check') ? '選択してください' : '入力してください';
    return { err, val: '', empty: true };
  }
  if (f.type === 'file' || f.type === 'radio' || f.type === 'check' || f.type === 'textarea') return { err: '', val: v };
  const h = toHalf(v);
  if (f.type === 'num') {
    if (!/^\d+$/.test(h)) return { err: '数字で入力してください', val: v };
    if (+h < f.min || +h > f.max) return { err: f.min + '〜' + f.max + 'の数字で入力してください', val: v };
    return { err: '', val: String(+h) };
  }
  if (f.type === 'tel') {
    const d = h.replace(/[-\s()]/g, '');
    return /^0\d{9,10}$/.test(d) ? { err: '', val: d } : { err: '電話番号を数字で入力してください（例：09012345678）', val: v };
  }
  if (f.type === 'zip') {
    const d = h.replace(/[-\s]/g, '');
    return /^\d{7}$/.test(d) ? { err: '', val: d.slice(0, 3) + '-' + d.slice(3) } : { err: '7桁の数字で入力してください', val: v };
  }
  if (f.type === 'date8') {
    const d = h.replace(/[^\d]/g, '');
    const y = +d.slice(0, 4), m = +d.slice(4, 6), day = +d.slice(6, 8);
    const dt = new Date(y, m - 1, day);
    const ok = /^\d{8}$/.test(d) && dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === day && y >= 1920 && dt < new Date();
    return ok ? { err: '', val: d.slice(0, 4) + '/' + d.slice(4, 6) + '/' + d.slice(6, 8) } : { err: '8桁の数字で、正しい日付を入力してください（例：19900405）', val: v };
  }
  if (f.type === 'email') {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(h) ? { err: '', val: h } : { err: 'メールアドレスの形を確認してください', val: v };
  }
  return { err: '', val: v };
}

function validate(a) {
  const errs = {};
  FIELDS.forEach(f => {
    if (!f.k) return;
    const r = checkOne(f, a[f.k]);
    if (r.err) errs[f.k] = r.err; else if (f.type !== 'file') a[f.k] = r.val;
  });
  return errs;
}

// 入力中の見た目：正しく入れた必須項目にチェック、途中の項目は打ち終わったら（showErr）エラーを出す
function refreshField(form, f, showErr) {
  const r = checkOne(f, collect(form)[f.k]);
  const box = document.querySelector('.field[data-k="' + CSS.escape(f.k) + '"]');
  if (!box) return;
  box.classList.toggle('ok', f.req && !r.err && !r.empty);
  if (showErr) setErr(f.k, r.empty ? '' : r.err);
  else if (!r.err) setErr(f.k, '');
  refreshCount(form);
}

function refreshCount(form) {
  const a = collect(form);
  const req = FIELDS.filter(f => f.k && f.req);
  const ok = req.filter(f => { const r = checkOne(f, a[f.k]); return !r.err && !r.empty; }).length;
  const el = $('reqCount');
  el.textContent = ok === req.length ? '必須項目はすべて入力できました ✓' : '必須項目 ' + ok + ' / ' + req.length + ' 入力済み';
  el.classList.toggle('all', ok === req.length);
}

// 郵便番号から住所を入れる（zipcloud）
let zipFilled = '';
function lookupZip(form) {
  const zip = toHalf(form.elements['郵便番号'].value).replace(/[^\d]/g, '');
  const addr = form.elements['住所'];
  const msg = document.querySelector('.field[data-k="郵便番号"] .zipmsg');
  if (zip.length !== 7) { msg.textContent = ''; return; }
  msg.textContent = '住所を探しています…';
  const cb = 'zipcb' + Date.now();
  const s = document.createElement('script');
  const cleanup = () => { delete window[cb]; s.remove(); };
  const timer = setTimeout(() => { cleanup(); msg.textContent = '住所を自動で入れられませんでした。手で入力してください。'; }, 6000);
  window[cb] = res => {
    clearTimeout(timer); cleanup();
    const r = res && res.results && res.results[0];
    if (!r) { msg.textContent = 'この郵便番号の住所が見つかりませんでした。番号を確認してください。'; return; }
    const base = r.address1 + r.address2 + r.address3;
    // 空欄か、前に自動で入れたままなら上書きする（手で書いた住所は消さない）
    if (!addr.value.trim() || addr.value.trim() === zipFilled) {
      addr.value = base; zipFilled = base;
      msg.textContent = '住所を入れました。続けて番地・建物名・部屋番号を入力してください。';
      addr.focus(); addr.setSelectionRange(base.length, base.length);
      saveDraft(form);
    } else {
      msg.textContent = '郵便番号の住所：' + base + '（ご住所の欄は書きかえていません）';
    }
  };
  s.src = 'https://zipcloud.ibsnet.co.jp/api/search?zipcode=' + zip + '&callback=' + cb;
  s.onerror = () => { clearTimeout(timer); cleanup(); msg.textContent = '住所を自動で入れられませんでした。手で入力してください。'; };
  document.head.appendChild(s);
}

// 写真を軽くしてから送る（長い辺 1800px・JPEG）。縮められない形式はそのまま送る
async function shrink(file) {
  try {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.src = url;
    await img.decode();
    const scale = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    if (blob) return blob;
  } catch (e) {}
  return file;
}

function toBase64(blob) {
  return new Promise((ok, ng) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = ng; r.readAsDataURL(blob); });
}

async function submit(form) {
  const btn = $('submit'), prog = $('progress');
  $('submitErr').textContent = '';
  FIELDS.forEach(f => f.k && setErr(f.k, ''));
  const a = collect(form);
  const errs = validate(a);
  const keys = Object.keys(errs);
  if (keys.length) {
    keys.forEach(k => setErr(k, errs[k]));
    document.querySelector('.field[data-k="' + CSS.escape(keys[0]) + '"]').scrollIntoView({ behavior: 'smooth', block: 'center' });
    $('submitErr').textContent = '確認が必要な項目が' + keys.length + '件あります。赤字の項目を確認してください。';
    return;
  }
  btn.disabled = true; btn.textContent = '送信中…';
  try {
    // 1) 写真を1枚ずつ送る
    const files = {};
    const list = FIELDS.filter(f => f.type === 'file' && picked[f.k]);
    for (let i = 0; i < list.length; i++) {
      const f = list[i];
      prog.textContent = '写真を送信しています（' + (i + 1) + ' / ' + list.length + '）…';
      const blob = await shrink(picked[f.k]);
      if (blob.size > 10 * 1024 * 1024) throw new Error('写真「' + f.t + '」が大きすぎます。撮り直してください。');
      const r = await post({ action: 'file', idToken: liff.getIDToken(), field: f.k, name: a['氏名'], mime: blob.type || 'image/jpeg', data: await toBase64(blob) }, 60000);
      if (!r || !r.ok) throw new Error('写真「' + f.t + '」を送れませんでした。');
      files[f.k] = r.fileId;
    }
    // 2) 回答を送る
    prog.textContent = '回答を送信しています…';
    const r = await post({ action: 'form', idToken: liff.getIDToken(), answers: a, files, params: params() }, 30000);
    if (!r || !r.ok) throw new Error('送信できませんでした。');
    try { localStorage.removeItem(CONF.DRAFT_KEY); } catch (e) {}
    done('送信しました', '内容を確認して、担当者からLINEでご連絡します。');
  } catch (err) {
    btn.disabled = false; btn.textContent = '送信する'; prog.textContent = '';
    $('submitErr').textContent = (err && err.message && /写真|送信/.test(err.message) ? err.message + ' ' : '') + '電波の良いところで、もう一度「送信する」を押してください。';
  }
}

// 入力途中の内容をこの端末に保存（写真は保存しない）
function saveDraft(form) {
  try { localStorage.setItem(CONF.DRAFT_KEY, JSON.stringify(collect(form))); } catch (e) {}
}
function restoreDraft(form) {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(CONF.DRAFT_KEY) || 'null'); } catch (e) {}
  if (!d) return;
  FIELDS.forEach(f => {
    if (!f.k || !d[f.k] || f.type === 'file') return;
    if (f.type === 'radio' || f.type === 'check') {
      const vals = String(d[f.k]).split('、');
      form.querySelectorAll('input[name="' + CSS.escape(f.k) + '"]').forEach(c => { c.checked = vals.indexOf(c.value) >= 0; });
    } else if (form.elements[f.k]) form.elements[f.k].value = d[f.k];
  });
}

main().catch(err => { done('うまく開けませんでした', 'LINEアプリから開き直してください。'); console.error(err); });
